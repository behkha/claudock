# Builds the installers on each platform's own runner.
# Pushing a v* tag (matching package.json's version) attaches them to a draft release for that tag;
# publish it on GitHub by hand. Running the workflow by hand only builds, and leaves the files as run artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # --publish never: the release job uploads, so three builders never race to create the release.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Keep the ad-hoc signature from electron-builder.yml; never look for a signing identity on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --draft --title "Claudock $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md --generate-notes
          fi
