<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 32">
  <!-- Menu bar item, macOS: the icon's tilde and cursor redrawn at menu bar scale. 18x16 pt drawn on its 2x pixel grid
       (36x32), so the cursor's edges fall on whole pixels; a 1.75 pt line like the system's own icons. Black on clear:
       a template image, which macOS tints to match the menu bar. -->
  <path d="M 4.5 17.8 C 6.6 13.5, 10.7 13.2, 14 16 C 17.2 18.8, 21.3 18.6, 23.5 14.3" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="27" y="9" width="4" height="14" rx="1" fill="#000"/>
</svg>
